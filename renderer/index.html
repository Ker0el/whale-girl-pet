<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- style-src needs 'self' for the external stylesheet; 'unsafe-inline' alone
         silently blocks it, which leaves the GIF at its natural size and
         overflowing the small window. Images are blob: URLs built from IPC
         bytes, so no network origin is needed here at all. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; img-src blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>鲸鱼娘桌宠</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img id="pet" alt="桌宠" draggable="false" />
    <script src="pet.js"></script>
  </body>
</html>
